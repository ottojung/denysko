[project]
name = "denysko"
version = "0.1.0"
description = "Single-letter to Desmos polynomial converter"
readme = "docs/SPEC.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "matplotlib",
    "scipy>=1.17.1",
]

[project.scripts]
denysko = "src.__main__:entry"
denysko-debug = "src.denysko:debug_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
