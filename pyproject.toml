[project]
name = "denysko"
version = "0.1.0"
description = "Single-letter to Desmos polynomial converter"
readme = "docs/SPEC.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "matplotlib",
]

[project.scripts]
denysko = "src.__main__:entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
