name: Diagnose issue 37 t tails

on:
  push:
    branches: [issue-37-t-tail-regression]

permissions:
  contents: read

env:
  MPLBACKEND: Agg

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-6-cormorant
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Install locked environment
        run: uv sync --locked
      - name: Diagnose Cormorant t
        run: |
          echo '--- issue-6-cormorant public CLI t ---'
          uv run denysko t --seed 42 -q | tee /tmp/t-cormorant-equations.txt
          echo '--- fitted t routes ---'
          uv run python - <<'PY'
          import numpy as np
          from src import denysko as d
          from src.fitting import fit_route, preferred_tail_orientation, INITIAL_FIT_DEGREE
          from src.topology import route_join_score
          geom, graph, candidates, chosen, sigs, corridors = d.build_phase1('t')
          print('glyph', geom.ymin, geom.ymax)
          for i, (r, c) in enumerate(zip(chosen, corridors)):
              pts = c.path.points
              f = fit_route(c, hi=INITIAL_FIT_DEGREE)
              print(i,
                    'join=', route_join_score(graph, r),
                    'xspan=', float(np.ptp(pts[:, 0])),
                    'yspan=', float(np.ptp(pts[:, 1])),
                    'preferred=', preferred_tail_orientation(c),
                    'fit=', None if f is None else f.orientation,
                    'degree=', None if f is None else f.degree)
          PY
          mkdir -p artifacts
          uv run python tools/preview.py "t" artifacts/issue37-t-cormorant.png --seed 42
      - uses: actions/upload-artifact@v4
        with:
          name: issue37-t-cormorant-preview
          path: |
            artifacts/issue37-t-cormorant.png
            /tmp/t-cormorant-equations.txt
