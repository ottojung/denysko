name: PR32 diagnostics

on:
  push:
    branches:
      - issue-6-cormorant

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Inspect compact components and difficult fits
        run: |
          uv run python - <<'PY'
          from src import denysko as d
          from src import fitting as f
          from src.skeleton import stroke_graph
          from src.topology import glyph_connected_components

          for ch in ('i', 'j', '.', ':'):
              geom = d.glyph_geometry(ch)
              labels, n_comp, info = glyph_connected_components(geom)
              sg = stroke_graph(geom.fill)
              graph = d.build_stroke_route_graph(geom)
              print(f"COMPACT {ch!r}: components={n_comp} info={info}")
              print("  skeleton nodes=", [(n.kind, n.xy, n.radius) for n in sg.nodes])
              print("  skeleton edges=", [(e.a, e.b, len(e.points)) for e in sg.edges])
              print("  route report=", graph.atom_report)

          for ch in ('H', 'B', 'T', 'K'):
              _, _, _, _, _, selected = d.build_phase1(ch)
              print(f"FIT {ch!r}: routes={len(selected)}")
              for idx, corr in enumerate(selected):
                  ori = f.preferred_tail_orientation(corr)
                  hits = []
                  for degree in (40, 60, 80, 100, 120, 140):
                      fit = f.fit_degree(corr, degree, *ori)
                      hits.append((degree, fit is not None))
                  print(f"  route {idx}: {hits}")
          PY
