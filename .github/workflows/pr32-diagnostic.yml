name: PR32 diagnostics

on:
  push:
    branches:
      - issue-6-cormorant

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Inspect compact disconnected components
        run: |
          uv run python - <<'PY'
          from src import denysko as d
          from src.skeleton import skeletonize, stroke_graph
          from src.topology import glyph_connected_components
          import numpy as np
          from scipy import ndimage

          for ch in ('i', 'j', '.', ':'):
              geom = d.glyph_geometry(ch)
              labels, n_comp, info = glyph_connected_components(geom)
              skel = skeletonize(geom.fill)
              comp_lab, n_skel = ndimage.label(skel, structure=np.ones((3, 3)))
              skel_sizes = [int(np.sum(comp_lab == i)) for i in range(1, n_skel + 1)]
              sg = stroke_graph(geom.fill)
              graph = d.build_stroke_route_graph(geom)
              print(f"COMPACT {ch!r}: fill_components={n_comp} info={info}")
              print(f"  skeleton_components={n_skel} sizes={skel_sizes}")
              print("  skeleton nodes=", [(n.kind, n.xy, round(n.radius, 2)) for n in sg.nodes])
              print("  skeleton edges=", [(e.a, e.b, len(e.points)) for e in sg.edges])
              print("  route report=", graph.atom_report)
          PY
