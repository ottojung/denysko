name: Apply PR32 solver fix

on:
  push:
    branches:
      - issue-6-cormorant

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-6-cormorant
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python .github/pr32_solver_patch.py
      - name: Commit solver fix if needed
        run: |
          if ! git diff --quiet -- src/fitting.py src/denysko.py; then
            git config user.name "Otto Jung"
            git config user.email "121908118+ottojung@users.noreply.github.com"
            git add src/fitting.py src/denysko.py
            git commit -m "Fix Chebyshev conditioning across escape tails"
            git push origin HEAD:issue-6-cormorant
          fi
